<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="שאלון לימודי אינטראקטיבי למבחן">
  <title>שאלון לימודי</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
      color: #15243b;
      background: linear-gradient(135deg, #edf5ff, #f8fbff);
    }
    main {
      width: min(100%, 42rem);
      padding: 3.25rem 2.5rem;
      text-align: center;
      background: #fff;
      border: 1px solid #dce7f5;
      border-radius: 1.25rem;
      box-shadow: 0 1rem 3rem rgba(20, 63, 112, .12);
    }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 6vw, 3rem); }
    p { margin: 0; color: #51627c; font-size: 1.1rem; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <h1>שאלון לימודי</h1>
    <p>האתר מוכן. תוכן השאלון יתווסף לאחר קבלת נושא המבחן והדרישות.</p>
  </main>
</body>
</html>
